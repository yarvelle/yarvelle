[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yarvelle"
version = "0.1.0"
description = "Yarvelle: Privacy-preserving local-first personal and family AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial License 1.0.0 and Yarvelle Additional Terms" }
authors = [
    { name = "Spectrayan", email = "engineering@spectrayan.com" }
]
keywords = [
    "ai",
    "assistant",
    "family",
    "household",
    "privacy",
    "local-first",
    "vault",
    "multi-pack"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]

dependencies = [
    "yarvelle-core>=0.1.0,<0.2.0",
    "carefold>=0.5.0b1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "structlog>=24.1.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
    "build>=1.2.0",
    "hatchling>=1.25.0",
    "import-linter>=2.0",
]

[project.scripts]
yarvelle = "yarvelle.cli:main"

# Pack API v1 entry-point group: domain packs registered here
[project.entry-points."yarvelle.packs"]
finance = "yarvelle.finance:get_pack"
education = "yarvelle.education:get_pack"
household = "yarvelle.household:get_pack"

[tool.hatch.build.targets.wheel]
packages = ["src/yarvelle"]
dev-mode-dirs = ["src"]
artifacts = ["src/yarvelle/_content"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"


[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "../agents",
    "../skills",
    "../README.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:.*httpx.*:DeprecationWarning",
]
