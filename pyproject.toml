[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yarvelle"
version = "0.1.0"
description = "Yarvelle: Privacy-preserving local-first personal and family AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial License 1.0.0 and Yarvelle Additional Terms" }
authors = [
    { name = "Spectrayan", email = "engineering@spectrayan.com" }
]
keywords = [
    "ai",
    "assistant",
    "family",
    "household",
    "privacy",
    "local-first",
    "vault",
    "multi-pack"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography"
]

dependencies = [
    "yarvelle-core>=0.1.0,<0.2.0",
    "carefold-health>=0.5.0b1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "structlog>=24.1.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",
]

[project.scripts]
yarvelle = "yarvelle.cli:main"

# Pack API v1 entry-point group: domain packs registered here
[project.entry-points."yarvelle.packs"]
finance = "yarvelle_finance:get_pack"
kids = "yarvelle_kids:get_pack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yarvelle" = [
    "*.yaml",
    "*.json",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --asyncio-mode=auto"
testpaths = ["tests", "packs/finance/tests", "packs/kids/tests"]
pythonpath = ["src", "packs/finance/src", "packs/kids/src"]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:.*httpx.*:DeprecationWarning",
]
