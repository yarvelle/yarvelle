[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yarvelle-pack-finance"
version = "0.1.0"
description = "Yarvelle Finance Pack: personal and household financial organization, budgeting, bill tracking, and statement parsing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial License 1.0.0 and Yarvelle Additional Terms" }
authors = [{ name = "Spectrayan", email = "yarvelle@spectrayan.com" }]
dependencies = [
    "yarvelle-core>=0.1.0,<0.2.0",
]

[project.entry-points."yarvelle.packs"]
finance = "yarvelle_finance:get_pack"

[tool.setuptools.packages.find]
where = ["src"]
