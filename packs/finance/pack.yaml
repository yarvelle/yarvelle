pack_api: 1
id: finance
name: Yarvelle Finance Pack
version: 0.1.0
domain: finance
requires_core: ">=0.1.0,<0.2.0"
requires_packs: []
license: "PolyForm-Noncommercial-1.0.0"
maintainers:
  - "yarvelle/finance-maintainers"
risk_tier_max: "T3"

scopes:
  - id: finance.*
    description: "All financial records and operations"
    consent: required
    sensitivity: confidential
  - id: finance.accounts
    description: "Masked financial account identifiers and current balances"
    consent: required
    sensitivity: confidential
  - id: finance.transactions
    description: "Transaction history and categorized expense entries"
    consent: required
    sensitivity: confidential
  - id: finance.bills
    description: "Recurring bill schedules, due dates, and reminders"
    consent: optional
    sensitivity: internal
  - id: finance.budget
    description: "Monthly planned vs actual household budgets"
    consent: optional
    sensitivity: internal
  - id: finance.statements
    description: "Parsed statement documents and extracted metadata"
    consent: optional
    sensitivity: confidential

reads:
  - id: health.paperwork
    level: read
    purpose: "Reconcile medical visit invoices and EOBs with HSA/FSA records"
    optional: true

provides:
  agents_dir: agents/
  skills_dir: skills/
  tools:
    - id: parse_statement
      entry: yarvelle_finance.tools:SPEC_PARSE_STATEMENT
      scopes: {write: [finance.statements]}
      tier: write_local
      data_flows: {egress: []}
    - id: categorize_expense
      entry: yarvelle_finance.tools:SPEC_CATEGORIZE_EXPENSE
      scopes: {write: [finance.transactions]}
      tier: write_local
      data_flows: {egress: []}
    - id: list_bills
      entry: yarvelle_finance.tools:SPEC_LIST_BILLS
      scopes: {read: [finance.bills]}
      tier: read
      data_flows: {egress: []}
    - id: track_budget
      entry: yarvelle_finance.tools:SPEC_TRACK_BUDGET
      scopes: {write: [finance.budget]}
      tier: write_local
      data_flows: {egress: []}
    - id: view_medical_costs
      entry: yarvelle_finance.tools:SPEC_VIEW_MEDICAL_COSTS
      scopes: {read: [finance.statements]}
      tier: read
      data_flows: {egress: []}
  routers:
    - entry: yarvelle_finance.routers.accounts:router
      prefix: "/api/v1/finance/accounts"
      require_scope: {id: finance.accounts, level: read}
    - entry: yarvelle_finance.routers.transactions:router
      prefix: "/api/v1/finance/transactions"
      require_scope: {id: finance.transactions, level: read}
    - entry: yarvelle_finance.routers.bills:router
      prefix: "/api/v1/finance/bills"
      require_scope: {id: finance.bills, level: read}
    - entry: yarvelle_finance.routers.budget:router
      prefix: "/api/v1/finance/budget"
      require_scope: {id: finance.budget, level: read}
  jobs: []
  safety_policy: "yarvelle_finance.safety:FinanceSafetyPolicy"
  routing:
    description: "Personal and household money organization, bill tracking, statement filing, and budgeting"
    default_agent: "finance-organizer"
    patterns: "resources/routing_patterns.yaml"
  prompts_dir: "resources/prompts/"
  locales_dir: "resources/locales/"
  connectors_dir: "connectors/"
  evals: "evals/golden.jsonl"

migrations:
  branch: finance
  version_table: alembic_version_finance
  location: src/yarvelle_finance/db/migrations
  depends_on_core: "0011_scopes"

compat:
  python: ">=3.12"
  data_dir_policy: shared
