[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yarvelle-pack-kids"
version = "0.1.0"
description = "Yarvelle Kids Pack: education navigation, homework assistance, reading logs, school forms, activities, and household coordination."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial License 1.0.0 and Yarvelle Additional Terms" }
authors = [{ name = "Spectrayan", email = "yarvelle@spectrayan.com" }]
dependencies = [
    "yarvelle-core>=0.1.0,<0.2.0",
]

[project.entry-points."yarvelle.packs"]
kids = "yarvelle_kids:get_pack"

[tool.setuptools.packages.find]
where = ["src"]
