pack_api: 1
id: kids
name: Yarvelle Kids Pack
version: 0.1.0
domain: kids
requires_core: ">=0.1.0,<0.2.0"
requires_packs: []
license: "PolyForm-Noncommercial-1.0.0"
maintainers:
  - "yarvelle/kids-maintainers"
risk_tier_max: "T2"

scopes:
  - id: kids.*
    description: "All child education and household coordination data"
    consent: required
    sensitivity: confidential
  - id: kids.assignments
    description: "Homework assignments, school projects, and due dates"
    consent: optional
    sensitivity: confidential
  - id: kids.activities
    description: "Extracurricular activities, sports, clubs, and practice schedules"
    consent: optional
    sensitivity: internal
  - id: kids.milestones
    description: "Child developmental progress and learning milestones"
    consent: optional
    sensitivity: confidential
  - id: kids.reading
    description: "Daily reading practice logs and book tracking"
    consent: optional
    sensitivity: internal
  - id: kids.forms
    description: "Draft prefilled permission slips and school emergency forms"
    consent: required
    sensitivity: pii
  - id: kids.chores
    description: "Household chore rotations, completion streaks, and routines"
    consent: optional
    sensitivity: internal
  - id: kids.meals
    description: "Weekly family meal planning, allergen rules, and groceries"
    consent: optional
    sensitivity: internal
  - id: kids.calendar
    description: "Synchronized school and activity calendar events"
    consent: optional
    sensitivity: internal

reads:
  - id: health.clinical
    level: read
    purpose: "Access child immunization dates and exam summaries to draft school and camp health forms"
    optional: true
  - id: household.calendar
    level: read
    purpose: "Cross-domain family schedule collision and deadline conflict detection"
    optional: true

provides:
  agents_dir: agents/
  skills_dir: skills/
  tools:
    - id: school_assignment_sync
      entry: yarvelle_kids.tools:SPEC_SCHOOL_ASSIGNMENT_SYNC
      scopes: {write: [kids.assignments]}
      tier: write_local
      data_flows: {egress: []}
    - id: activity_schedule
      entry: yarvelle_kids.tools:SPEC_ACTIVITY_SCHEDULE
      scopes: {write: [kids.activities]}
      tier: write_local
      data_flows: {egress: []}
    - id: milestone_tracker
      entry: yarvelle_kids.tools:SPEC_MILESTONE_TRACKER
      scopes: {write: [kids.milestones]}
      tier: write_local
      data_flows: {egress: []}
    - id: manage_assignments
      entry: yarvelle_kids.tools:SPEC_MANAGE_ASSIGNMENTS
      scopes: {write: [kids.assignments]}
      tier: write_local
      data_flows: {egress: []}
    - id: manage_reading_logs
      entry: yarvelle_kids.tools:SPEC_MANAGE_READING_LOGS
      scopes: {write: [kids.reading]}
      tier: write_local
      data_flows: {egress: []}
    - id: manage_school_forms
      entry: yarvelle_kids.tools:SPEC_MANAGE_SCHOOL_FORMS
      scopes: {write: [kids.forms]}
      tier: write_local
      data_flows: {egress: []}
    - id: study_quiz_helper
      entry: yarvelle_kids.tools:SPEC_STUDY_QUIZ_HELPER
      scopes: {read: [kids.assignments]}
      tier: read
      data_flows: {egress: []}
    - id: manage_chores
      entry: yarvelle_kids.tools:SPEC_MANAGE_CHORES
      scopes: {write: [kids.chores]}
      tier: write_local
      data_flows: {egress: []}
    - id: manage_meal_plan
      entry: yarvelle_kids.tools:SPEC_MANAGE_MEAL_PLAN
      scopes: {write: [kids.meals]}
      tier: write_local
      data_flows: {egress: []}
  routers:
    - entry: yarvelle_kids.routers.assignments:router
      prefix: "/api/v1/kids/assignments"
      require_scope: {id: kids.assignments, level: read}
    - entry: yarvelle_kids.routers.activities:router
      prefix: "/api/v1/kids/activities"
      require_scope: {id: kids.activities, level: read}
    - entry: yarvelle_kids.routers.milestones:router
      prefix: "/api/v1/kids/milestones"
      require_scope: {id: kids.milestones, level: read}
    - entry: yarvelle_kids.routers.reading:router
      prefix: "/api/v1/kids/reading"
      require_scope: {id: kids.reading, level: read}
    - entry: yarvelle_kids.routers.forms:router
      prefix: "/api/v1/kids/forms"
      require_scope: {id: kids.forms, level: read}
    - entry: yarvelle_kids.routers.chores:router
      prefix: "/api/v1/kids/chores"
      require_scope: {id: kids.chores, level: read}
  jobs: []
  safety_policy: "yarvelle_kids.safety:KidsSafetyPolicy"
  routing:
    description: "School navigation, homework coaching, reading logs, activities, and chore coordination"
    default_agent: "school-guide"
    patterns: "resources/routing_patterns.yaml"
  prompts_dir: "resources/prompts/"
  locales_dir: "resources/locales/"
  connectors_dir: "connectors/"
  evals: "evals/golden.jsonl"

migrations:
  branch: kids
  version_table: alembic_version_kids
  location: src/yarvelle_kids/db/migrations
  depends_on_core: "0011_scopes"

compat:
  python: ">=3.12"
  data_dir_policy: shared
